services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: pedro
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedro -d blog"]
      interval: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./backend
    ports:
      - "8002:8001"
    environment:
      DATABASE_URL: postgresql://pedro:password@db:5432/blog
      SECRET_KEY: your-secret-key-change-this
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
